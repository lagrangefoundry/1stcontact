<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>REQ-265 — an inline run's line box, and a control's placeholder ink</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1280px; font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; }
      section { padding: 40px 88px; }

      /* The gigabytealchemy wordmark shape: an INLINE <span> inside an <a>, whose
         getBoundingClientRect is the CONTENT AREA (the font's ascent+descent at
         72px), not the line box. Line-height is deliberately SHORTER than any real
         font's content area at this size, so the half-leading is negative in every
         engine: the rect's top sits ABOVE the line box, which is the direction the
         reference site showed. */
      .tight { font-size: 72px; line-height: 60px; font-weight: 700; }

      /* The ordinary direction — a line box roomier than the content area, so the
         rect's top sits BELOW it. Both signs are proved, not just the one that
         happened to be on the reference. */
      .roomy { font-size: 20px; line-height: 60px; }

      /* The same type on a BLOCK element: the no-regression control. Its rect is
         the border box, so its top is the PADDING's top, a whole 24px above the
         first line box — a block run's box must keep saying that. */
      h2.block { font-size: 72px; line-height: 90px; font-weight: 700; padding-top: 24px; }

      /* A band with a known fill, so a half-alpha UA placeholder composites to a
         value the test can bracket. The fields paint no fill of their own. */
      .band { background: #e8dfd3; padding: 40px 88px; }
      .band h3 { font-size: 24px; line-height: 32px; margin-bottom: 16px; }
      .band input, .band textarea {
        display: block;
        margin-bottom: 12px;
        border: 1px solid #b9ae9d;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        background: transparent;
        color: #101010;
      }
      /* Deliberately three DIFFERENT shapes: three same-sized fields in a row read
         as a repeated item, and a repeated item's root is excluded from the
         text-free element scan — so the controls would never be captured at all. */
      #stated { width: 320px; }
      #inherited { width: 440px; height: 120px; }
      #faded { width: 380px; }
      #silent { width: 260px; }
      /* Three placeholders, three shapes the capture has to handle:
         - stated:  an opaque authored colour, recorded verbatim;
         - inherited: nothing authored, so the engine's own default (which computes
           OPAQUE — rgb(117, 117, 117) — measured, not assumed);
         - faded: Tailwind v4's preflight rule verbatim. Its computed value is
           `oklab(… / 0.5)`, which the rgb()/rgba() regex cannot read at all and
           which is translucent, so it needs both resolving AND compositing. */
      #stated::placeholder { color: #746f69; }
      #faded::placeholder { color: color-mix(in oklab, currentColor 50%, transparent); }
    </style>
  </head>
  <body>
    <section>
      <a href="#"><span class="tight">Gigabyte Alchemy</span></a>
    </section>
    <section>
      <h2 class="block">Intentional Software</h2>
      <p><span class="roomy">Roomy inline run</span></p>
    </section>
    <section class="band">
      <h3>Say hello</h3>
      <form action="#">
        <input id="stated" type="email" placeholder="Your stated email" />
        <textarea id="inherited" placeholder="Your default message"></textarea>
        <input id="faded" type="tel" placeholder="Your faded number" />
        <input id="silent" type="text" value="" aria-label="No placeholder here" />
      </form>
    </section>
  </body>
</html>
