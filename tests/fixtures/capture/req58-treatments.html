<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>REQ-58 wrapper treatments</title>
    <style>
      body { margin: 0; background: #e8dfd3; font-family: sans-serif; }
      section { padding: 40px 80px; background: #d9ccba; }
      /* The accent bar is on a WRAPPER, not the text — the case the capture missed. */
      .callout { border-left: 4px solid #00d492; padding-left: 24px; }
      /* A card with its own fill distinct from the band. */
      .card { background: #ffffff; padding: 24px; }
    </style>
  </head>
  <body>
    <section>
      <div class="callout"><p>These aren't just features</p></div>
      <div class="card"><h3>Presence</h3><p>Card body copy</p></div>
      <p>Plain band paragraph</p>
    </section>
  </body>
</html>
