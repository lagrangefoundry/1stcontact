<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REQ-47 structural fixture</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; color: #0f172a; }
      .hero {
        background: #0b1220;
        color: #e2e8f0;
        min-height: 320px;
        padding: 48px 64px;
      }
      .hero h1 { font-size: 56px; font-weight: 700; }
      .hero p { margin-top: 16px; font-size: 20px; color: #94a3b8; }
      .contact {
        background: #f8fafc;
        padding: 48px 64px;
        min-height: 200px;
      }
      /* The subscribe control: input and button rendered side-by-side (a row).
         The input labels itself with a placeholder — the name is INSIDE the box,
         no separate <label> element renders above it. */
      .subscribe {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .subscribe input {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        width: 320px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .subscribe button {
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 16px;
        background: #2563eb;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Intentional Software</h1>
      <p>Tools for clarity, presence, and positive connection.</p>
    </section>
    <section class="contact">
      <form class="subscribe" action="#">
        <input type="email" placeholder="Your email address" />
        <button type="submit">Subscribe</button>
      </form>
    </section>
  </body>
</html>
