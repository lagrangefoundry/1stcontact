<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AC-748 — translucent veils in modern colour syntaxes, plus both negatives</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Arial, sans-serif; }

      /* 1. A hero photo veiled by a colour carrying its own alpha, authored the
            way Tailwind v4 emits `bg-slate-950/30`: color-mix() in oklab. This is
            a colour-with-alpha, NOT element opacity. */
      .hero {
        position: relative;
        height: 500px;
        background-image: url('hero.png');
        background-size: cover;
        background-position: center;
      }
      .hero-veil {
        position: absolute;
        inset: 0;
        background-color: color-mix(in oklab, #020618 30%, transparent);
      }
      .hero h1 { position: relative; padding: 200px 40px 0; color: #ffffff; font-size: 48px; }

      /* 2. Negative control — an OPAQUE fill, no veil. Sits between the two
            veiled bands so neither can coalesce into the other. */
      .opaque { height: 300px; background-color: #e8dfd3; }
      .opaque p { padding: 40px; color: #111111; font-size: 18px; }

      /* 3. A second veil in a DIFFERENT modern syntax — oklch() with a slash
            alpha — over the same photo, so "any notation the engine accepts" is
            exercised by more than one colour path. */
      .band-veiled {
        position: relative;
        height: 400px;
        background-image: url('hero.png');
        background-size: cover;
      }
      .band-veil {
        position: absolute;
        inset: 0;
        background-color: oklch(0.3 0.06 250 / 0.45);
      }
      .band-veiled h2 { position: relative; padding: 160px 40px 0; color: #ffffff; font-size: 36px; }

      /* 4. Negative control — neither image nor veil. */
      .bare { height: 300px; }
      .bare p { padding: 40px; color: #111111; font-size: 18px; }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-veil"></div>
      <h1>Veiled hero headline</h1>
    </section>
    <section class="opaque">
      <p>Opaque band copy.</p>
    </section>
    <section class="band-veiled">
      <div class="band-veil"></div>
      <h2>Veiled band headline</h2>
    </section>
    <section class="bare">
      <p>Bare section copy.</p>
    </section>
  </body>
</html>
