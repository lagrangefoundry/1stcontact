<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gradient stop positions fixture</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #ffffff; }
      section { padding: 48px; }
      /* The gigabytealchemy wordmark: a horizontal (90deg) text-fill gradient
         whose cream holds to 60% before turning to orange — the stop *offsets*
         REQ-59 must capture (positionless capture rendered it "orange too soon"). */
      .wordmark {
        font-size: 72px;
        font-weight: 600;
        background-image: linear-gradient(90deg, #f5e6a3 0%, #f5e6a3 60%, #ff8c42 90%, #ff6b35 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <section>
      <h1 class="wordmark">Gigabyte Alchemy</h1>
    </section>
  </body>
</html>
