<!doctype html><html><head><meta charset="utf-8"><title>wrapped semantics</title>
<style>
  body { margin: 0; background: #e8dfd3; font-family: system-ui }
  main { padding: 40px }
  /* The gradient-text treatment that forces the presentational wrapper: the
     gradient has to be clipped to the glyphs of an element that is ONLY the
     glyphs, so the words get their own <span> inside the <a> / <h1>. */
  .wordmark span {
    background: linear-gradient(90deg, #f5e6a3 0%, #f5e6a3 60%, #ff8c42 90%, #ff6b35 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .wordmark { font-size: 56px; font-weight: 600; text-decoration: none; white-space: nowrap }
  h1 { font-size: 36px; margin: 24px 0 }
  /* The four padding sides and the alignment REQ-302 persists. */
  .boxed { padding: 11px 13px 17px 19px; text-align: center; background: #f8f5f2; color: #1e293b }
</style></head>
<body><main>
  <a href="/" class="wordmark"><span>Gigabyte Alchemy</span></a>
  <h1><span style="color:#fbba72">Intentional Software</span></h1>
  <h2>Plain Heading Owns Its Text</h2>
  <p class="boxed">A padded, centred paragraph.</p>
</main></body></html>
