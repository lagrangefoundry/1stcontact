<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REQ-48 rendered-axes fixture</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; color: #0f172a; background: #fff; }
      /* A real web font — the intended face must resolve before signals are read
         (fonts-ready precondition); the heading run then records fontLoaded true. */
      @font-face {
        font-family: 'GoldHead';
        src: url('/heading-font.ttf') format('truetype');
        font-weight: 700;
        font-display: block;
      }
      /* An entrance keyframe animation — reduced-motion emulation collapses it to
         its end state so the projection reads identically frame-to-frame. */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .hero { position: relative; background: #0b1220; color: #e2e8f0; min-height: 320px; padding: 48px 64px; overflow: hidden; }
      /* A separate translucent full-bleed scrim div, stacked UNDER the title. */
      .scrim { position: absolute; inset: 0; z-index: 1; background: rgba(2, 6, 23, 0.5); }
      /* The heading sits ABOVE the scrim (explicit z-index) and glows (text-shadow),
         set in the web font, with an entrance animation. */
      .title {
        position: relative; z-index: 10;
        font-family: 'GoldHead', serif; font-size: 56px; font-weight: 700;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        animation: fadeIn 0.3s ease both;
      }
      .gallery { background: #f8fafc; padding: 48px 64px; }
      .media { display: flex; gap: 24px; align-items: flex-start; }
      /* object-fit media, filter halo, clip-path mask, and a rotated layer — one
         axis each, distinct classes so none form a repeated item group. */
      .cover { width: 160px; height: 120px; object-fit: cover; }
      .blurred { width: 120px; height: 120px; filter: blur(2px) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3)); }
      .avatar { width: 120px; height: 120px; clip-path: circle(50%); }
      .tilted { width: 120px; height: 120px; transform: rotate(6deg); }
      /* A control declaring BOTH a hover transition and an entrance animation. */
      .subscribe {
        margin-top: 24px; border: 0; border-radius: 8px; padding: 12px 24px; font-size: 16px;
        background: #2563eb; color: #fff;
        transition: transform 0.2s ease; animation: fadeIn 0.3s ease both;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="scrim"></div>
      <h1 class="title">Layered Hero</h1>
    </section>
    <section class="gallery">
      <div class="media">
        <img class="cover" src="/hero.png" alt="Cover photo" />
        <img class="blurred" src="/logo.png" alt="Blurred mark" />
        <img class="avatar" src="/logo.png" alt="Round avatar" />
        <img class="tilted" src="/logo.png" alt="Tilted layer" />
      </div>
      <button class="subscribe" type="button">Subscribe</button>
    </section>
  </body>
</html>
