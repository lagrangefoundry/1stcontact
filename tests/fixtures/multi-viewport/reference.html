<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>reference</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: sans-serif; }
      /* The wordmark sits a FIXED 256px from the left at every width — it does not
         reflow. This is the target behaviour a %-positioned repro must match. */
      .wordmark { margin-left: 256px; font-size: 24px; font-weight: 700; color: #111111; }
    </style>
  </head>
  <body>
    <h1 class="wordmark">ACME</h1>
  </body>
</html>
