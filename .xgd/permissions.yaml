directory-spaces:
  project:
    includes:
    - ${project_perimeter}
    excludes:
    - path: .xgd/config.yaml
      comment: Project-wide quality/build config — main-only, dashboard-edited (REQ-709).
    - path: .xgd/quality.yaml
      comment: Quality gate configuration — main-only, dashboard-edited (REQ-709).
    - path: .xgd/permissions.yaml
      comment: The policy governing this very session — must never be self-editable.
    - path: .xgd/surfaces.yaml
      comment: Surface/exposure configuration — main-only, dashboard-edited (REQ-709).
    - path: ${main}/.xgd/config.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree (BUG-1194).
    - path: ${main}/.xgd/quality.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree (BUG-1194).
    - path: ${main}/.xgd/permissions.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree (BUG-1194).
    - path: ${main}/.xgd/surfaces.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree (BUG-1194).
    - path: ${dist}/**
      comment: The entire installed xgd distribution — engine code and prompts (incl.
        session_roles.yaml) — a fixed package-install path, not project-relative;
        the Edit tool can reach it directly (DOC-981 §15/§16, REQ-807).
  all_projects:
    includes:
    - ${all_projects_perimeter}
    excludes:
    - path: .xgd/config.yaml
      comment: Project-wide quality/build config — main-only, dashboard-edited (REQ-709).
    - path: .xgd/quality.yaml
      comment: Quality gate configuration — main-only, dashboard-edited (REQ-709).
    - path: .xgd/permissions.yaml
      comment: The policy governing this very session — must never be self-editable.
    - path: .xgd/surfaces.yaml
      comment: Surface/exposure configuration — main-only, dashboard-edited (REQ-709).
    - path: ${main}/.xgd/config.yaml
      comment: Absolute main-anchored form — protects the home project's real file
        regardless of cwd.
    - path: ${main}/.xgd/quality.yaml
      comment: Absolute main-anchored form — protects the home project's real file
        regardless of cwd.
    - path: ${main}/.xgd/permissions.yaml
      comment: Absolute main-anchored form — protects the home project's real file
        regardless of cwd.
    - path: ${main}/.xgd/surfaces.yaml
      comment: Absolute main-anchored form — protects the home project's real file
        regardless of cwd.
    - path: ${dist}/**
      comment: The entire installed xgd distribution — a fixed package-install path,
        not project-relative (REQ-807).
    - path: ${each_project.main}/.xgd/config.yaml
      comment: Multiplied per OTHER registered project (DOC-981 §12.2) — an all_projects-scoped
        session must not edit any in-scope project's governance files, not just the
        home project's.
    - path: ${each_project.main}/.xgd/quality.yaml
      comment: Multiplied per OTHER registered project (DOC-981 §12.2).
    - path: ${each_project.main}/.xgd/permissions.yaml
      comment: Multiplied per OTHER registered project (DOC-981 §12.2).
    - path: ${each_project.main}/.xgd/surfaces.yaml
      comment: Multiplied per OTHER registered project (DOC-981 §12.2).
  user:
    includes:
    - ${home}
    excludes:
    - path: .xgd/config.yaml
      comment: Project-wide quality/build config — main-only, dashboard-edited (REQ-709).
    - path: .xgd/quality.yaml
      comment: Quality gate configuration — main-only, dashboard-edited (REQ-709).
    - path: .xgd/permissions.yaml
      comment: The policy governing this very session — must never be self-editable.
    - path: .xgd/surfaces.yaml
      comment: Surface/exposure configuration — main-only, dashboard-edited (REQ-709).
    - path: ${main}/.xgd/config.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree.
    - path: ${main}/.xgd/quality.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree.
    - path: ${main}/.xgd/permissions.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree.
    - path: ${main}/.xgd/surfaces.yaml
      comment: Absolute main-anchored form — protects the real file when this session's
        cwd is a non-main worktree.
    - path: ${dist}/**
      comment: The entire installed xgd distribution — a fixed package-install path,
        not project-relative (REQ-807).
  'off': {}
sandbox:
  excluded_commands:
  - command: xgd branch clean *
    comment: Validated ticket-scoped worktree teardown (cmd_clean) — .git/worktrees/**
      blocks pre-existing entries under any WHERE grant regardless of role (BUG-1195),
      so the wrapper's own internal ticket-existence + merged-ancestor checks must
      run unsandboxed.
  - command: xgd report-bug *
    comment: Cross-project bug delivery to the registered xgd project via the ticket
      API's own resolver (REQ-787) — Bash-allowlisted for every headless role, so
      this closes DOC-981 §10.5's report-bug/all_projects tension without granting
      all_projects WHERE to any role just to make this one command work.
roles:
  interactive:
    where: all_projects
    what:
      tools:
      - Read
      - Edit
      - Glob
      - Grep
      - Bash
    mode: bypassPermissions
    additional_directories:
    - ~/Library/Preferences/.wrangler/
    network: 'on'
    mach_lookup: 'on'
