chat:
  provider: claude
claude_code:
  allow_api_key: false
  allowed_paths: []
  process_restart:
    initial_delay_minutes: 10
    max_attempts: 5
    token_limit_fallback_hours: 5
    token_limit_jitter_minutes: 3
  rate_limit:
    calls_per_hour: 9
    enabled: false
  session_priming_max_attempts: 20
  sessions:
    assessor:
      model: opus
    builder:
      model: opus
    editor:
      model: opus
    planner:
      model: opus
  timeout: 1800
dashboard:
  bind_address: 127.0.0.1
  default_port: 8888
  idle_timeout: NEVER
dispatcher:
  bundle_untangle_gap_commits: 50
  costs:
    auto_merge_back: 0.6
    develop: 1.0
    reconcile: 0.5
    regression: 1.0
  max_concurrent_capacity: 4
  max_unmerged_feature_branches: 8
  poll_interval_seconds: 30
  regression:
    auto_start: true
    scheduled_time: '23:00'
merge_back:
  max_iterations: 5
  reconciliation:
    auto_merge_back: true
  regression:
    auto_merge_back: true
notifications:
  backends:
  - ntfy
  enabled: false
  events:
    choice_point: true
    workflow_failed: true
    workflow_success: false
  macos:
    sound: true
  ntfy:
    tags:
    - xgd
    - workflow
    topic: xgd-notifications
    url: https://ntfy.sh
project:
  architecture: null
  brd: null
  checklist: null
  dev_model: null
  prd: null
quality:
  min_coverage_percent: 25.0
quality_checks:
  batch_iteration_buffer_percent: 50
  max_attempts_per_phase: 3
  max_retry_attempts: 5
  phase_limits:
    build: 3
    coverage: 10
    lint: 3
    tests: 10
  phase_timeouts:
    build: 600
    coverage: 900
    lint: 300
    tests: 900
  test_batch_size: 5
required_files:
- README.md
- ARCHITECTURE.md
resource_limits:
  enabled: true
  max_concurrent_simulators: 2
  max_load_average: null
  max_total_retry_hours: 2.0
  min_free_memory_gb: null
resync:
  max_iterations: 10
retries:
  max: 3
sprint:
  max_tasks_per_sprint: 5
  skip_validation: true
structural_validation:
  max_uats_per_capability: 200
  min_uats_per_capability: 20
ticketing:
  audit_interval_seconds: 3600
  commits:
    enabled: true
    message_template: 'xgd(ticket): {op} {type} {uid}'
  include_archived_default: false
  lock_timeout_ms: 10000
  locks_dir: .xgd/_locks
  root_dir: .xgd/tickets
  staging_dir: .xgd/_staging
  strict_mode: false
watchdog:
  max_fix_cycles: 20
workflow:
  memory_poll_interval_s: 30
  min_free_ram_mb: 500
