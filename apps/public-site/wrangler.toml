name = "1stcontact-public-site"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# [[REQ-200]] — the apex is a published 1c site now, not a string literal.
#
# `APEX_SITE_KEY` names the site served at the root of this host; it is
# configuration and never a URL segment, so no request can ask for another one.
# It is empty here because a local `wrangler dev` has no published apex until
# somebody publishes one — set it in `.dev.vars` to work on the apex locally.
#
# The two session vars are how this Worker knows which cookie to read and which
# host it was issued for. Reading it decides WHICH STATE of `account-chrome`
# renders and nothing else: no page is gated and no published content varies.
# Empty means this deployment issues no sessions, so every visitor is signed out.
[vars]
APEX_SITE_KEY = ""
SESSION_COOKIE_NAME = ""
SESSION_COOKIE_DOMAIN = ""

# The bucket the control-app publishes rendered revisions to (REQ-110/REQ-111).
# Declared at the top level for `wrangler dev` and repeated under
# [env.production] because a named environment does not inherit bindings.
[[r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

# The revision log (REQ-149). This Worker READS ONLY: it asks which revision is
# live and never writes a row — publishing is control-app's, behind Access. The
# binding is the same database control-app declares, because there is one record
# of what is published and this is it; the deploy manifest that used to answer
# this question from R2 is deleted.
#
# No `migrations_dir` here, deliberately. Migrations belong to the database and
# are applied once, by the Worker that owns the schema (control-app). Declaring
# them in two places would let two deploys race the same migration.
[[d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"

[env.production]
name = "1stcontact-public-site"
routes = [
  # public-site is the generic multi-tenant site server:
  #   apex (1stcontact.io)  = /site/<slug>/… for every deployed site, and later
  #                           the 1st Contact marketing site at /
  #   *.1stcontact.io       = customer sites by slug subdomain (declared, not
  #                           yet served — subdomain routing is additive)
  # `app` is a reserved slug, so control-app's more-specific app.1stcontact.io/*
  # route takes precedence over this wildcard.
  #
  # The apex is a custom domain rather than a zone route so wrangler provisions
  # the DNS record and certificate itself: the zone has no proxied record for the
  # apex, and a route alone would resolve to nothing.
  { pattern = "1stcontact.io", custom_domain = true },
  { pattern = "*.1stcontact.io/*", zone_name = "1stcontact.io" }
]

# A named environment inherits no vars, so the apex and session configuration is
# repeated rather than assumed. `SESSION_COOKIE_DOMAIN` is the apex domain, which
# is what lets `1stcontact.io` and `app.1stcontact.io` share one session while a
# customer's own domain has its own — see `session.ts`.
[env.production.vars]
APEX_SITE_KEY = ""
SESSION_COOKIE_NAME = "session"
SESSION_COOKIE_DOMAIN = "1stcontact.io"

[[env.production.r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

[[env.production.d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"
