name = "1stcontact-public-site"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# [[REQ-200]] — the apex is a published 1c site now, not a string literal.
#
# `APEX_SITE_KEY` names the site served at the root of this host; it is
# configuration and never a URL segment, so no request can ask for another one.
# It is empty here because a local `wrangler dev` has no published apex until
# somebody publishes one — set it in `.dev.vars` to work on the apex locally.
#
# The two session vars are how this Worker knows which cookie to read and which
# host it was issued for. Reading it decides WHICH STATE of `account-chrome`
# renders and nothing else: no page is gated and no published content varies.
# Empty means this deployment issues no sessions, so every visitor is signed out.
#
# TURNSTILE_SITEKEY is the PUBLIC half of the anti-spam widget ([[REQ-223]] §6).
#
# A VAR AND NOT A SECRET: it is printed in the markup of every served page that
# carries a form, so hiding it would make the configuration unauditable without
# hiding anything from anybody. The SECRET half is `wrangler secret put
# TURNSTILE_SECRET` and is never in this file.
#
# EMPTY MEANS NO WIDGET AND — separately, and this is the important half — a
# REFUSED ENDPOINT. An unstamped mount is inert rather than broken, and
# `lead.ts` refuses every submission while the secret is missing, on the same
# fail-closed reasoning `access.ts` uses. A deployment that forgot Turnstile
# takes no leads; it does not take unverified ones.
[vars]
APEX_SITE_KEY = ""
SESSION_COOKIE_NAME = ""
SESSION_COOKIE_DOMAIN = ""
TURNSTILE_SITEKEY = ""

# The bucket the control-app publishes rendered revisions to (REQ-110/REQ-111).
# Declared at the top level for `wrangler dev` and repeated under
# [env.production] because a named environment does not inherit bindings.
[[r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

# The revision log (REQ-149). This Worker READS ONLY: it asks which revision is
# live and never writes a row — publishing is control-app's, behind Access. The
# binding is the same database control-app declares, because there is one record
# of what is published and this is it; the deploy manifest that used to answer
# this question from R2 is deleted.
#
# No `migrations_dir` here, deliberately. Migrations belong to the database and
# are applied once, by the Worker that owns the schema (control-app). Declaring
# them in two places would let two deploys race the same migration.
[[d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"


# THE WRITE PATH, AND IT IS NOT A URL ([[REQ-223]] §3.2).
#
# `POST /api/lead` arrives here, on the published site's own origin, and the
# WRITE it implies belongs to control-app: `addContact` is the one definition of
# how a person enters a tenant, and a second implementation in this Worker would
# be two answers to that question, free to drift.
#
# `entrypoint` IS THE WHOLE POINT. A service binding to the default handler would
# mean an internal HTTP path on control-app — something a request can NAME, and
# therefore one Access misconfiguration away from being a public write endpoint
# into every tenant's contact list. A named `WorkerEntrypoint` is reachable over
# this binding and there is no URL that reaches it at all.
#
# AND A SERVICE-BINDING CALL NEVER TRAVERSES THE EDGE, so this needs no Access
# bypass policy — which is why lead capture works where `/sign-in` currently does
# not (see apps/control-app/ACCESS.md and [[REQ-223]] §10.2).
#
# REPEATED UNDER [env.production] because a named environment inherits NEITHER
# vars NOR bindings — the rule this file already records for R2 and D1. Omitting
# the repeat is not a silent degradation: `lead.ts` refuses every submission when
# the binding is absent, rather than acknowledging one it cannot write.
[[services]]
binding = "LEAD_INTAKE"
service = "1stcontact-control-app"
entrypoint = "LeadIntake"

# Cloudflare's own rate limiter, keyed on the site and the source IP — the two
# things a caller cannot vary ([[REQ-223]] §6). Everything in a submission's body
# is caller-chosen and worthless as a key.
#
# GENEROUS BY DESIGN. A per-site cap is itself a denial of service against that
# customer, since filling the bucket refuses their real enquiries — so this is a
# backstop and Turnstile is the sharp instrument. Zone-level WAF rate-limiting
# rules are complementary and are configuration rather than code.
#
# `namespace_id` IS AN OPAQUE HANDLE chosen per binding and is not a secret; the
# period must be 10 or 60 seconds, which is the platform's constraint and not
# ours. Absent, `lead.ts` refuses rather than running unmetered.
[[unsafe.bindings]]
name = "LEAD_RATE_LIMIT"
type = "ratelimit"
namespace_id = "2231"
simple = { limit = 20, period = 60 }

[env.production]
name = "1stcontact-public-site"
routes = [
  # public-site is the generic multi-tenant site server:
  #   apex (1stcontact.io)  = /site/<slug>/… for every deployed site, and later
  #                           the 1st Contact marketing site at /
  #   *.1stcontact.io       = customer sites by slug subdomain (declared, not
  #                           yet served — subdomain routing is additive)
  # `app` is a reserved slug, so control-app's more-specific app.1stcontact.io/*
  # route takes precedence over this wildcard.
  #
  # The apex is a custom domain rather than a zone route so wrangler provisions
  # the DNS record and certificate itself: the zone has no proxied record for the
  # apex, and a route alone would resolve to nothing.
  { pattern = "1stcontact.io", custom_domain = true },
  { pattern = "*.1stcontact.io/*", zone_name = "1stcontact.io" }
]

# A named environment inherits no vars, so the apex and session configuration is
# repeated rather than assumed. `SESSION_COOKIE_DOMAIN` is the apex domain, which
# is what lets `1stcontact.io` and `app.1stcontact.io` share one session while a
# customer's own domain has its own — see `session.ts`.
[env.production.vars]
APEX_SITE_KEY = ""
SESSION_COOKIE_NAME = "session"
SESSION_COOKIE_DOMAIN = "1stcontact.io"
# See the top-level block: restated rather than inherited, on purpose
# ([[REQ-223]]). A named environment inherits no vars, and the failure of
# omitting this one is a production apex whose forms show no widget.
TURNSTILE_SITEKEY = ""

[[env.production.r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

[[env.production.d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"

# See the top-level block: restated rather than inherited, on purpose ([[REQ-223]]).
[[env.production.services]]
binding = "LEAD_INTAKE"
service = "1stcontact-control-app"
entrypoint = "LeadIntake"

# See the top-level block: restated rather than inherited, on purpose ([[REQ-223]]).
[[env.production.unsafe.bindings]]
name = "LEAD_RATE_LIMIT"
type = "ratelimit"
namespace_id = "2231"
simple = { limit = 20, period = 60 }
