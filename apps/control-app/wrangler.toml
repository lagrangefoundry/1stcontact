name = "1stcontact-control-app"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Where `wrangler d1 migrations apply` looks (REQ-143). The migrations live at
# the repo root, beside the schema they describe, rather than under this app —
# they are the *platform's* schema and the D1 binding is only declared here
# because control-app is the first Worker to reach the store.
migrations_dir = "../../db/migrations"

# The builder's Node origin (REQ-115). A plain var, deliberately not an
# [assets] binding — an assets binding makes `unstable_dev` hang, which would
# cost us the ability to test this Worker at all. This goes when the store is
# reachable from a Worker (DOC-12 §7 phase 2) and the render can run here; see
# src/index.ts for what REQ-119 moved and what it left.
#
# Declared at the top level for `wrangler dev` and REPEATED under
# [env.production] because a named environment does not inherit vars — the same
# rule public-site's wrangler.toml records for bindings. Omitting the repeat is
# not a silent degradation: the deployed Worker sees no BUILDER_ORIGIN at all
# and answers every request with its own 503 (REQ-144). A UAT pins the two
# sides together so the omission cannot recur unnoticed.
[vars]
BUILDER_ORIGIN = "http://localhost:8790"

# The site store (REQ-143 / DOC-12 §7 phase 2): definitions in D1, asset bytes in
# R2. Declared at the top level for `wrangler dev` and REPEATED under
# [env.production] because a named environment inherits NEITHER vars nor
# bindings. Forgetting the repeat is not a silent degradation — the deployed
# Worker sees no binding at all and every store call throws on `undefined`, the
# same class of failure REQ-144 hit with BUILDER_ORIGIN. A UAT pins the two sides
# together so it cannot recur unnoticed.
[[d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"

# The same bucket public-site already publishes rendered snapshots to. One
# bucket, keyed by prefix: `<root>/<slug>/rev/NNNN/…` for deployed output,
# `draft/<tenant>/<slug>/assets/…` for the draft assets this store writes.
[[r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

[env.production]
name = "1stcontact-control-app"
routes = [
  { pattern = "app.1stcontact.io/*", zone_name = "1stcontact.io" }
]

# A localhost origin is unreachable from a deployed Worker by any value of this
# var, so production answers 502 rather than 503 until REQ-145 moves the routes
# into workerd and deletes the proxy. That is the point: the failure becomes
# honest and diagnosable instead of looking like missing configuration.
[env.production.vars]
BUILDER_ORIGIN = "http://localhost:8790"

[[env.production.d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"

[[env.production.r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"
