name = "1stcontact-control-app"
# `src/worker.ts` AND NOT `src/index.ts` ([[REQ-223]]). The default handler still
# lives in `index.ts`; what `worker.ts` adds is the named `LeadIntake` RPC
# entrypoint, which imports the workerd BUILT-IN `cloudflare:workers` and so can
# only be loaded inside the runtime. Roughly sixty node-project suites import
# `index.ts`; keeping that module resolvable outside workerd is why the split
# exists. Anything else needing a workerd built-in belongs in `worker.ts` too.
main = "src/worker.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# OFF, and this is a security control rather than tidiness (REQ-147).
#
# Cloudflare Access is attached to a HOSTNAME. `workers_dev = true` gives this
# Worker a second hostname — `1stcontact-control-app.<subdomain>.workers.dev` —
# that no Access policy covers, so the builder would be served to anyone who
# guessed it while the policy on `app.1stcontact.io` looked perfectly correct.
# `workers_dev` IS inherited by a named environment (unlike vars and bindings),
# so the top-level declaration governs production too; it is repeated below
# anyway, because a security control that depends on remembering which keys
# inherit is one refactor from silently flipping back on.
workers_dev = false

# Invocation logs, and the reason this is not optional (BUG-37).
#
# Without this block the account retains NO per-invocation logs — only aggregate
# analytics. BUG-37 was diagnosed from source and a billing page because of that
# absence: it was possible to establish THAT a request had been killed and not
# WHICH URL killed it, which turned a one-log answer into an inference chain.
#
# `head_sampling_rate = 1` keeps every invocation. This Worker serves one
# operator's builder, so the volume is trivial and a sampled log is a log that is
# missing exactly the request you came to read.
#
# REPEATED UNDER [env.production] BELOW. `observability` is on wrangler's
# inheritable list, unlike vars and bindings — so the repeat is redundant TODAY
# and is written anyway, for the reason the vars below are: this file's own rule
# is that nothing depends on remembering which keys inherit. A UAT pins both
# declarations, because the failure mode of losing the production one is silent —
# the deploy succeeds and the logs simply are not there.
[observability]
enabled = true
head_sampling_rate = 1

# The builder's browser assets (REQ-145), built by `1c assets`.
#
# THE HANG IS GONE. This binding was refused before because an [assets] binding
# made `unstable_dev` hang, which would have cost the ability to test this Worker
# at all, which is why the proxy's origin stayed a plain var. Re-measured on wrangler
# 4.106 the worker is ready in ~3s and both routes answer, so the constraint that
# shaped the old design no longer holds and the note is replaced rather than
# carried forward.
#
# `run_worker_first = true` IS THE SECURITY CONTROL, not a routing preference.
# By default the assets binding answers BEFORE the Worker, which would serve
# `/builder/*` and `/webui/*` to anyone who asked — the Access gate lives in
# `fetch`, and bytes that never enter `fetch` are never gated. Running the Worker
# first puts every asset behind the same verified identity as every route; the
# router hands unmatched paths to `env.ASSETS` once the caller is known. A UAT
# asserts an unauthenticated asset request is refused.
[assets]
directory = "./dist-assets"
binding = "ASSETS"
run_worker_first = true

# TENANT_ID names the PLATFORM's own business (REQ-168), BY KEY ([[REQ-190]]).
#
# It used to be the word `1stcontact`, which was the business's *name* doing a
# key's job: the value propagated into every `tenant_id`, into R2 prefixes and
# into `/b/<id>/` URLs, so the business could never be renamed. The business is
# called `1st Contact` in `tenants.name` now, where it can change, and is keyed
# by the opaque value below. The var stays deployment CONFIGURATION rather than a
# row (REQ-180 D5, DOC-42 §2) — what changed is that it names a key.
#
# AND THE PREFIX SAYS `biz` ([[REQ-194]]). It read `acct_` while `newId('acct')`
# minted business ids and the account had no table; now that accounts exist and
# carry keys of their own, an id reading `acct_` has to mean an account. The hex
# is unchanged — the same business, renamed prefix.
#
# THE VALUE IS A LITERAL TWO FILES MUST AGREE ON. `db/migrations/0001_baseline.sql`
# seeds this exact id as the platform business's row, and nothing about the value
# is derivable, so nothing could notice them disagreeing except a check that
# compares them — `test_UAT_FC_REQ-190_tenant_id_literal` is that check. A
# mismatch is `UnknownTenantError` on every deployed request.
#
# It used to name the
# account this deployment serves (REQ-145); it no longer answers "whose site am I
# editing", because that comes from the caller's identity now — `scope.ts`
# resolves it from the businesses their memberships admit them to. What is left is
# the business `users` rows for builder users live in, and where the admin console
# operates.
#
# It is still read on exactly one request path: unconfigured local dev, where
# there is no Access token and therefore no identity to resolve from. That read is
# inside `resolveScope` and is gated on the same predicate that skips the gate, so
# it cannot apply to a deployment that has ACCESS_TEAM_DOMAIN / ACCESS_AUD set.
#
# There is still no default: `d1r2SiteStore` refuses an unknown tenant at
# construction, and a well-known fallback name would let a misconfigured Worker
# read and WRITE into whichever tenant happened to carry it.
#
# ACCESS_DEV_OPEN is LOCAL ONLY and is declared at the top level DELIBERATELY.
# `wrangler dev` reads [vars]; `wrangler deploy --env production` reads
# [env.production.vars] and inherits nothing, so this key cannot reach the
# deployed Worker unless someone restates it there — and a UAT fails the build if
# anyone does. It has no effect at all once ACCESS_TEAM_DOMAIN / ACCESS_AUD are
# set, so it cannot open a configured deployment either. See src/index.ts.
#
# Every var below is REPEATED under [env.production] because a named environment
# does not inherit vars — the same rule public-site's wrangler.toml records for
# bindings. Omitting a repeat is not a silent degradation: the deployed Worker
# sees the key as absent (REQ-144). A UAT pins the two sides together so the
# omission cannot recur unnoticed.
# ACCESS_TEAM_DOMAIN / ACCESS_AUD identify the Access application this Worker
# will accept tokens for (REQ-147). Neither is a secret — the team domain is
# public and the AUD tag is an identifier, not a credential — so both live here
# rather than in `wrangler secret`, where a value nobody can read would make the
# gate unauditable.
#
# EMPTY MEANS DENY. Until they are filled in, the Worker answers 503 to every
# request rather than serving unverified: an unconfigured gate that let traffic
# through would be the exact hole this ticket closes. Fill them in per
# apps/control-app/ACCESS.md, which is also where the granted identities are
# recorded.
# PLATFORM_ADMINS is BREAK GLASS, and empty is the correct steady state
# ([[DOC-40]] §6, [[REQ-185]]). A comma-separated list of email addresses that
# may operate the 1st Contact business whatever the database says.
#
# It exists because [[REQ-185]] moved "owner of the 1st Contact business" onto
# `memberships.role`, which put it behind a ROW — and a missing row is exactly
# the lockout §6's ambient flag was there to prevent. Deployment configuration
# works before any row exists and cannot be revoked by the database it repairs,
# which is the whole of why it is here rather than in a table.
#
# EMPTY MEANS NOBODY, like ACCESS_TEAM_DOMAIN above: a capability that switches
# on when configuration goes missing is the opposite of a control. Fill it in to
# recover a deployment nobody can enter, and empty it again afterwards — using it
# WRITES the membership, so the repair outlives the var.
#
# Declared on BOTH sides for the reason every var here is: a named environment
# inherits none, and a break-glass key that silently does not exist in production
# is one discovered at the worst possible moment. A UAT pins the two together.
# SERVICE_TOKEN_IDENTITIES says WHO A SERVICE TOKEN IS ([[BUG-59]]).
# Comma-separated `name=address` pairs, where the name is the `common_name`
# Cloudflare puts in the JWT it mints for a Service Auth credential.
#
# It exists because a service token carries no email and `admit` needs one, so
# every one of them passed Access and was then refused `no_email` — the
# credential BUG-36 provisioned for `bin/publish` could authenticate and could
# not do anything. Mapping the token to a PERSON is the answer that needs no new
# concepts: it is that person's automation, so membership, entitlement, terms and
# revocation all apply unchanged. See `src/identity.ts`.
#
# EMPTY MEANS NOBODY, like PLATFORM_ADMINS above. An unmapped token is refused
# exactly as it was before this var existed, so nothing switches on when
# configuration goes missing, and either half of a two-sided revocation — delete
# the token in Cloudflare, or remove the entry here — is sufficient on its own.
#
# THE PRODUCTION ENTRY IS NOT A NEW GRANT. ACCESS.md's identity table already
# records `1stcontact-publish` as provisioned for `bin/publish`; this is the line
# that makes that record true. Locally the entry comes from
# `./bin/access-sim --print-env`, which emits it alongside the two Access vars.
# MAIL_FROM is the address every message this Worker sends comes FROM
# ([[REQ-196]]).
#
# A VAR AND NOT A SECRET, and not a literal at a call site either. It is not a
# credential — it is printed on every message it sends — and it is a fact about
# the DEPLOYMENT rather than about any one message, so it belongs where an
# operator can read it and change it once.
#
# THE ADDRESS ONLY WORKS IF DNS SAYS IT DOES. SPF, DKIM and DMARC on
# `1stcontact.io` are what stand between mail from this address and a spam
# folder, and they are an operator task with waiting in it rather than a coding
# one — see apps/control-app/MAIL.md.
#
# IT CARRIES A DISPLAY NAME, in RFC 5322 `Name <address>` form ([[REQ-205]]).
# An anonymous From is most of what makes a message from a domain with no
# reputation look like phishing to a filter, and the address is passed to the
# provider verbatim, so this form flows end to end with nothing to change.
#
# REPLIES TO THIS ONE GO NOWHERE, and that is now a statement about THIS address
# rather than about every message ([[REQ-205]]). `no-reply@` is not a mailbox
# anybody reads, so it is the fallback for the messages nobody should reply to; a
# template that wants a repliable sender names its own `from`, which is what the
# invite does.
#
# THE CREDENTIAL IS NOT HERE. `RESEND_API_KEY` is a `wrangler secret`, pushed by
# `bin/deploy.d/secrets/20-resend-api-key`, and its absence is what selects the
# local adapter that records and sends nothing — so a deployment that never
# received it does not send mail, rather than sending it from nowhere. A UAT
# asserts this file names it in neither environment.
#
# Declared on BOTH sides for the reason every var here is: a named environment
# inherits none, and an absent From address is a Worker that refuses to send at
# the moment it is asked to. A UAT pins the two together.
# SESSION_COOKIE_NAME / SESSION_COOKIE_DOMAIN — the cookie this Worker mints
# sessions under ([[REQ-202]], REQ-134 upstream).
#
# THE VALUES MUST MATCH `apps/public-site/wrangler.toml` CHARACTER FOR CHARACTER.
# That Worker already reads a session cookie by exactly these two values, to
# choose which of `account-chrome`'s states to render ([[REQ-200]]); this one is
# what writes it. The builder and the apex share a session precisely when the two
# files agree, and the symptom of disagreeing is a person signed in on one and
# signed out on the other with nothing anywhere reporting why. A UAT pins them
# together.
#
# THE DOMAIN IS THE APEX, NOT THE HOST. `Domain=1stcontact.io` reaches
# `app.1stcontact.io` and `1stcontact.io` both; a host-only cookie would reach the
# builder alone, and the Sign In control on the public apex would never see one.
#
# EMPTY AT THE TOP LEVEL IS HOST-ONLY AND IS CORRECT FOR `wrangler dev`, which
# serves on `127.0.0.1` — nobody's cookie domain. A NAME is still set there,
# because an empty name means this deployment issues no sessions at all and the
# local builder would have no way to sign anybody in.
[vars]
TENANT_ID = "biz_51a6746495c8057e886ff98d4208e6b9"
PLATFORM_ADMINS = ""
SERVICE_TOKEN_IDENTITIES = ""
ACCESS_DEV_OPEN = "1"
ACCESS_TEAM_DOMAIN = "lagrangefoundry.cloudflareaccess.com"
ACCESS_AUD = "c802fa9c4efc483e13f1c27d2d9a9ca3ff9336d55a014205bd1a63258260c74e"
MAIL_FROM = "1st Contact <no-reply@1stcontact.io>"
SESSION_COOKIE_NAME = "session"
SESSION_COOKIE_DOMAIN = ""

# The site store (REQ-143 / DOC-12 §7 phase 2): definitions in D1, asset bytes in
# R2. Declared at the top level for `wrangler dev` and REPEATED under
# [env.production] because a named environment inherits NEITHER vars nor
# bindings. Forgetting the repeat is not a silent degradation — the deployed
# Worker sees no binding at all and every store call throws on `undefined`, the
# same class of failure REQ-144 hit with the proxy's origin var. A UAT pins the two sides
# together so it cannot recur unnoticed.
[[d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"
# Where `wrangler d1 migrations apply` looks (REQ-143). The migrations live at
# the repo root, beside the schema they describe, rather than under this app —
# they are the *platform's* schema and the D1 binding is only declared here
# because control-app is the first Worker to reach the store.
#
# It belongs to the DATABASE, not to the top level (REQ-145). Declared top-level
# it is an unknown key: wrangler warns, ignores it, and then looks in
# `apps/control-app/migrations`, which does not exist — so `migrations apply` had
# never actually run. A UAT now asserts the key sits on the binding.
migrations_dir = "../../db/migrations"

# The same bucket public-site already publishes rendered snapshots to. One
# bucket, keyed by prefix: `<root>/<slug>/rev/NNNN/…` for deployed output,
# `draft/<tenant>/<slug>/assets/…` for the draft assets this store writes.
[[r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

# The client's private material (REQ-162), and it is DELIBERATELY NOT `SITES`.
#
# WHY A SECOND BUCKET RATHER THAN A PREFIX IN THE FIRST. `1stcontact-sites` is
# bound by `apps/public-site` — the Worker whose entire job is serving bytes to
# the public internet by path. What goes in here is the opposite: brand
# guidelines, positioning papers, competitor captures, everything a client hands
# over in confidence. Sharing the bucket would leave only routing code between a
# confidential document and a public URL.
#
# This is BUG-31's mistake ([[DOC-12]] §7) with a worse failure mode. There, a
# `--sandbox` deploy shared a keyspace with a real site and could overwrite its
# published bytes; the remedy was a key prefix. That is not enough here, because
# the failure is not overwrite but DISCLOSURE — and a prefix is a convention
# enforced by whoever remembers it, while a bucket boundary is enforced by the
# absence of a binding. public-site cannot read what it is not handed.
#
# Keys are `t/<tenant>/blob/<sha256>` ([[DOC-38]] §7.2), composed by the
# component's own `R2BlobStore` — content-addressed so one file attached twice
# is one blob, tenant-prefixed because a GLOBAL content address would be both an
# existence oracle across the tenant barrier and a contradiction of [[DOC-37]]
# erasure.
#
# REPEATED UNDER [env.production] because a named environment inherits NEITHER
# vars NOR bindings — the rule every other binding in this file records. Missing
# the repeat is not a degradation: `ticketStoreFor` throws at construction, which
# is the loud failure REQ-162 chose over an upload that 500s months later. A UAT
# pins the two sides together.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "1stcontact-material"

# Browser Rendering — the assistant's eyes in the cloud (REQ-154, [[DOC-13]] §6).
#
# A headless Chromium the Worker drives through `@cloudflare/puppeteer`, so the
# assistant can screenshot what it just built instead of describing it.
#
# METERED AND CAPPED, which is why `withBrowserSession` leases ONE browser per
# run and hands each driver a fresh browser CONTEXT rather than a whole browser.
# The account has a concurrency cap and an acquisition rate limit; a driver that
# stranded a session would degrade into an outage that looks like a hang.
#
# REPEATED UNDER [env.production] because a named environment inherits NEITHER
# vars NOR bindings — the same rule every other binding in this file records.
# Forgetting the repeat is not a silent degradation: the deployed Worker sees no
# binding at all and every screenshot raises BrowserNotConfiguredError. A UAT
# pins the two sides together so it cannot recur unnoticed.
[browser]
binding = "BROWSER"

# Workers AI — the embedding model behind the project knowledge base (REQ-159).
#
# ONE MODEL ON BOTH SIDES, which is a correctness property rather than a
# convenience. Search takes the dot product of a query vector and an index vector
# as their cosine similarity; vectors from two different models are not
# comparable, and the failure mode is not an error but plausible-looking
# nonsense. `1c kb build` indexes the system KB with Workers AI's
# `@cf/baai/bge-small-en-v1.5` over REST; this binding is the same model reached
# in-datacentre, so build-time and query-time vectors come from the same place by
# construction — and this side carries no credential at all.
#
# REPEATED UNDER [env.production] because a named environment inherits NEITHER
# vars NOR bindings — the rule every other binding in this file records.
# Forgetting the repeat is not a silent degradation: the deployed Worker sees no
# binding and `projectKnowledgeFor` raises AiNotConfiguredError, which is the
# loud failure this repository chooses over a knowledge base that quietly stops
# knowing anything. A UAT pins the two sides together.
[ai]
binding = "AI"

[env.production]
name = "1stcontact-control-app"
workers_dev = false
routes = [
  { pattern = "app.1stcontact.io/*", zone_name = "1stcontact.io" }
]

# See the top-level block: restated rather than inherited, on purpose (BUG-37).
# LAST in this environment's bare keys, because a TOML table header ends the
# table above it — declared before `routes`, this header would capture it and the
# production route would silently stop being declared at all.
[env.production.observability]
enabled = true
head_sampling_rate = 1

# No ACCESS_DEV_OPEN here, and that absence is the security control (REQ-145).
# A named environment inherits no vars, so the top-level declaration cannot reach
# production; restating it here would open the deployed builder to anyone the
# moment Access were unconfigured. A UAT asserts this block does not name it.
[env.production.vars]
TENANT_ID = "biz_51a6746495c8057e886ff98d4208e6b9"
# See the top-level block: break glass, empty until it is needed ([[REQ-185]]).
PLATFORM_ADMINS = ""
# See the top-level block. The name is the Service Auth token ACCESS.md's identity
# table already records; the address is the operator that table already names. A
# named environment inherits nothing, so the local empty above does not reach here
# — and an empty here would leave `bin/publish --production` authenticating and
# then being refused, which is the bug ([[BUG-59]]).
SERVICE_TOKEN_IDENTITIES = "1stcontact-publish=martin-github@westhead.me"
ACCESS_TEAM_DOMAIN = "lagrangefoundry.cloudflareaccess.com"
ACCESS_AUD = "c802fa9c4efc483e13f1c27d2d9a9ca3ff9336d55a014205bd1a63258260c74e"
# See the top-level block: restated rather than inherited, on purpose ([[REQ-196]]).
MAIL_FROM = "1st Contact <no-reply@1stcontact.io>"
# See the top-level block: restated rather than inherited, on purpose ([[REQ-202]]).
# The DOMAIN is set here and empty above: production shares a session with the
# public apex, and a loopback dev server has no apex to share one with.
SESSION_COOKIE_NAME = "session"
SESSION_COOKIE_DOMAIN = "1stcontact.io"

[env.production.assets]
directory = "./dist-assets"
binding = "ASSETS"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "1stcontact"
database_id = "0434cd88-07e0-4eb2-a7d8-7370c333534c"
migrations_dir = "../../db/migrations"

[[env.production.r2_buckets]]
binding = "SITES"
bucket_name = "1stcontact-sites"

# See the top-level block: restated rather than inherited, on purpose (REQ-162).
[[env.production.r2_buckets]]
binding = "BLOBS"
bucket_name = "1stcontact-material"

# See the top-level block: restated rather than inherited, on purpose (REQ-154).
[env.production.browser]
binding = "BROWSER"

# See the top-level block: restated rather than inherited, on purpose (REQ-159).
[env.production.ai]
binding = "AI"
