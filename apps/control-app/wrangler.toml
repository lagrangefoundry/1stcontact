name = "1stcontact-control-app"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The builder's Node dev origin (REQ-115). A plain var, deliberately not an
# [assets] binding — an assets binding makes `unstable_dev` hang, which would
# cost us the ability to test this Worker at all. DOC-28 §12 T5 removes this.
[vars]
BUILDER_ORIGIN = "http://localhost:8790"

[env.production]
name = "1stcontact-control-app"
routes = [
  { pattern = "app.1stcontact.io/*", zone_name = "1stcontact.io" }
]
