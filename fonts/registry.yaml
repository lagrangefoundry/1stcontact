# Font provenance registry — REQ-101
#
# The licence index over every font file in this project. Font *files* live
# per-site under `storage/<root>/<slug>/draft/assets/` so a site stays
# self-contained and portable; this file is the provenance record over them,
# and it is project-level because a licence obligation attaches to the font,
# not to the site that happens to reference it.
#
# Enforced by `1c fonts check`, which joins every site's `l1.resources.fonts`
# against these entries and fails on an unregistered family, an unregistered
# file, or a product-distributed site referencing a font whose
# `licence.redistribute_in_product` is not `true`.
#
# ── The field that carries the weight ────────────────────────────────────────
#
#   licence.redistribute_in_product
#
# "May I use this on xgd.dev" and "may I ship this to 10,000 customer sites"
# are DIFFERENT QUESTIONS WITH DIFFERENT ANSWERS. Commercial webfont licences
# are per-licensee — typically per-domain or by pageview — and agencies and
# hosting providers are explicitly barred from sharing one licence across
# client sites. Adobe Fonts additionally forbids self-hosting at all. So a
# font can be entirely fine here and still be unshippable as product.
#
#   true              settled: the licence permits product redistribution.
#   false             settled: it does not.
#   REVIEW_REQUIRED   asked, not yet answered. Every gate treats this as "no",
#                     so an unresolved licence cannot leak into the product by
#                     default.
#
# `actions` records outstanding licence work. It warns; it does not fail —
# an open action is exactly the state a font sits in while it is fine for this
# repo and not yet cleared for the product.
#
# ── Two provenance classes ───────────────────────────────────────────────────
#
# 1. AUTHORED — deliberately downloaded from the foundry for a site we author.
#    Satoshi, JetBrains Mono.
# 2. CAPTURE-DERIVED — arrived as a side effect of reproducing a third-party
#    site (`1c capture`). The bytes are a mirror of someone else's serving
#    infrastructure, usually a Google Fonts subset with a hashed filename. The
#    underlying family is often openly licensed, but the *subsetting and
#    delivery* provenance is unverified, so every one of these carries an
#    action to re-obtain from the canonical upstream release before product
#    use. They are reproduction inputs, not product assets.

fonts:
  # ── Authored ───────────────────────────────────────────────────────────────

  - family: Satoshi
    foundry: Indian Type Foundry
    source: https://www.fontshare.com/fonts/satoshi
    downloaded: '2026-07-25'
    licence:
      name: ITF Free Font Licence
      url: https://www.fontshare.com/licenses/itf-ffl
      commercial_use: true
      self_host: true
      # The ITF FFL grants free personal and commercial use with self-hosting,
      # but the grant is non-transferrable and terminable — it licenses *us*,
      # not everyone we hand a site to.
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Legal review before Satoshi enters the 1st Contact font menu: the ITF
        Free Font Licence is non-transferrable and terminable, so serving it
        from customer sites is a separate grant from our own use of it.
    files:
      - { path: satoshi-400.woff2, weight: 400, style: normal }
      - { path: satoshi-500.woff2, weight: 500, style: normal }
      - { path: satoshi-700.woff2, weight: 700, style: normal }
      - { path: satoshi-900.woff2, weight: 900, style: normal }

  - family: JetBrains Mono
    foundry: JetBrains
    source: https://www.jetbrains.com/lp/mono/
    downloaded: '2026-07-25'
    licence:
      name: SIL Open Font License 1.1
      url: https://scripts.sil.org/OFL
      commercial_use: true
      self_host: true
      # OFL 1.1 explicitly permits bundling and redistribution, including as
      # part of a larger work, subject to the conditions in `actions`.
      redistribute_in_product: true
    actions:
      - >-
        OFL 1.1 redistribution conditions must travel with the product build:
        ship the copyright notice and licence text, and do not sell the font
        files on their own.
    files:
      - { path: jetbrains-mono.woff2, weight: 400, style: normal, note: latin subset }

  # ── Capture-derived (reproduction inputs) ──────────────────────────────────

  - family: Cinzel
    foundry: Natanael Gama
    source: https://fonts.google.com/specimen/Cinzel
    downloaded: '2026-07-14'
    licence:
      name: SIL Open Font License 1.1
      url: https://scripts.sil.org/OFL
      commercial_use: true
      self_host: true
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived: this file was mirrored from gigabytealchemy.ai's Google
        Fonts delivery and carries a hashed CDN filename. Cinzel itself is OFL,
        but re-obtain from the canonical upstream release before any product use
        so the subset and version are known.
    files:
      - { path: 8vIJ7ww63mVu7gt79mT7PkRXMw.woff2, weight: 600, note: from capture of gigabytealchemy.ai }

  - family: Oswald
    foundry: Vernon Adams / Google Fonts
    source: https://fonts.google.com/specimen/Oswald
    downloaded: '2026-07-06'
    licence:
      name: SIL Open Font License 1.1
      url: https://scripts.sil.org/OFL
      commercial_use: true
      self_host: true
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived from joyfulculinarycreations.com. Oswald is OFL, but
        re-obtain from upstream before product use — subset and version unknown.
    files:
      - { path: oswald-tk3iwkuhhaijg752gt8g.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: oswald.woff2, note: renamed copy of the captured subset }

  - family: Lato
    foundry: Łukasz Dziedzic
    source: https://fonts.google.com/specimen/Lato
    downloaded: '2026-07-06'
    licence:
      name: SIL Open Font License 1.1
      url: https://scripts.sil.org/OFL
      commercial_use: true
      self_host: true
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived from joyfulculinarycreations.com. Lato is OFL, but
        re-obtain from upstream before product use — subset and version unknown.
    files:
      - { path: lato-s6u9w4bmutphh6uvswipgq.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: lato-s6u9w4bmutphh7usswipgq.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: lato-s6uyw4bmutphjx4wxg.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: lato-300.woff2, weight: 300, note: renamed copy of the captured subset }
      - { path: lato-400.woff2, weight: 400, note: renamed copy of the captured subset }
      - { path: lato-700.woff2, weight: 700, note: renamed copy of the captured subset }

  - family: Raleway
    foundry: Matt McInerney / Pablo Impallari / Rodrigo Fuenzalida
    source: https://fonts.google.com/specimen/Raleway
    downloaded: '2026-07-06'
    licence:
      name: SIL Open Font License 1.1
      url: https://scripts.sil.org/OFL
      commercial_use: true
      self_host: true
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived from joyfulculinarycreations.com. Raleway is OFL, but
        re-obtain from upstream before product use — subset and version unknown.
    files:
      - { path: raleway-1ptug8zys_skggpnyc0itw.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: raleway.woff2, note: renamed copy of the captured subset }

  - family: Karla
    foundry: Jonny Pinhorn
    source: https://fonts.google.com/specimen/Karla
    downloaded: '2026-07-06'
    licence:
      name: SIL Open Font License 1.1
      url: https://scripts.sil.org/OFL
      commercial_use: true
      self_host: true
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived from joyfulculinarycreations.com. Karla is OFL, but
        re-obtain from upstream before product use — subset and version unknown.
    files:
      - { path: karla-qkbbxvyc6trat7rvltw.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: karla-qkbvxvyc6trat7rqht6e4q.woff2, note: from capture of joyfulculinarycreations.com }
      - { path: karla.woff2, note: renamed copy of the captured subset }

  # ── Capture-derived icon fonts (not referenced by any site's L1) ───────────
  # On disk because the capture mirrored every subresource. Registered so the
  # bytes are accounted for rather than anonymous.

  - family: Font Awesome 5 Free
    foundry: Fonticons, Inc.
    source: https://fontawesome.com/license/free
    downloaded: '2026-07-06'
    licence:
      name: SIL Open Font License 1.1 (font files) / CC BY 4.0 (icons)
      url: https://fontawesome.com/license/free
      commercial_use: true
      self_host: true
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived from joyfulculinarycreations.com. Re-obtain from the
        Font Awesome Free distribution before any product use, and carry the
        CC BY 4.0 attribution the icon set requires.
    files:
      - { path: fa-solid-900.woff2, weight: 900, note: from capture of joyfulculinarycreations.com }
      - { path: fa-regular-400.woff2, weight: 400, note: from capture of joyfulculinarycreations.com }

  - family: Font Awesome 5 Brands
    foundry: Fonticons, Inc.
    source: https://fontawesome.com/license/free
    downloaded: '2026-07-06'
    licence:
      name: SIL Open Font License 1.1 (font files)
      url: https://fontawesome.com/license/free
      commercial_use: true
      self_host: true
      # Brand marks are third-party trademarks; Font Awesome licenses the
      # glyphs but not the right to imply endorsement.
      redistribute_in_product: REVIEW_REQUIRED
    actions:
      - >-
        Capture-derived from joyfulculinarycreations.com. Brand glyphs carry
        third-party trademark constraints independent of the font licence —
        legal review before any product use.
    files:
      - { path: fa-brands-400.woff2, weight: 400, note: from capture of joyfulculinarycreations.com }

  - family: eicons
    foundry: Elementor
    source: https://elementor.com/
    downloaded: '2026-07-06'
    licence:
      name: Unverified — Elementor plugin icon font
      url: https://elementor.com/terms/
      commercial_use: false
      self_host: false
      # Elementor's plugin is GPLv3, but this icon font ships as part of a
      # product whose terms we have not read, and it has no upstream standalone
      # release. Nothing here is cleared.
      redistribute_in_product: false
    actions:
      - >-
        Do not use outside reproduction. Capture-derived from
        joyfulculinarycreations.com; licence terms unverified and no standalone
        upstream distribution exists. Delete rather than promote to a site.
    files:
      - { path: eicons.woff2, note: from capture of joyfulculinarycreations.com }
